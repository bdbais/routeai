[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routeai"
version = "0.4.0"
description = "Delegate small coding tasks from Claude to your own Ollama machines, with priority routing and a self-learning benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Bais" }]
keywords = ["claude", "claude-code", "mcp", "ollama", "local-llm", "delegation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://routeai.bais.info"
Repository = "https://github.com/bdbais/routeai"
Donate = "https://paypal.me/bellizia"

[project.scripts]
routeai = "routeai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routeai"]
